name: Update Wpop cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-wpop-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Read latest stable Wpop release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/EmmanuelCanto/wpop/releases/latest"
          )"

          tag="$(jq --raw-output '.tag_name' <<<"${release_json}")"
          version="${tag#v}"
          download_url="$(
            jq --raw-output \
              '.assets[] | select(.name == "Wpop.dmg") | .browser_download_url' \
              <<<"${release_json}" |
              head -n 1
          )"

          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "The latest release has no usable tag" >&2
            exit 1
          fi

          if [[ -z "${download_url}" || "${download_url}" == "null" ]]; then
            echo "The latest release does not contain Wpop.dmg" >&2
            exit 1
          fi

          curl --fail --location --silent --show-error \
            "${download_url}" \
            --output "${RUNNER_TEMP}/Wpop.dmg"

          sha256="$(shasum --algorithm 256 "${RUNNER_TEMP}/Wpop.dmg" | awk '{print $1}')"

          {
            echo "version=${version}"
            echo "download_url=${download_url}"
            echo "sha256=${sha256}"
          } >>"${GITHUB_OUTPUT}"

      - name: Update cask
        run: |
          ruby Scripts/update_cask.rb \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.download_url }}" \
            "${{ steps.release.outputs.sha256 }}"

      - name: Validate cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          ruby -c Casks/wpop.rb

          tap_directory="$(brew --repository)/Library/Taps/emmanuelcanto/homebrew-wpop"
          mkdir -p "$(dirname "${tap_directory}")"
          ln -s "${GITHUB_WORKSPACE}" "${tap_directory}"

          brew style --cask EmmanuelCanto/wpop/wpop
          brew livecheck --cask EmmanuelCanto/wpop/wpop

      - name: Commit update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks/wpop.rb; then
            echo "Cask is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wpop.rb
          git commit -m "chore: update Wpop cask to ${VERSION}"
          git push
